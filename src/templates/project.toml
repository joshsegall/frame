# Frame project configuration
# Docs: https://github.com/[owner]/frame

[project]
name = "{{PROJECT_NAME}}"

# Tracks
# ------
# Each [[tracks]] entry defines a workstream. State is one of:
#   active   – shown in tabs and listings
#   shelved  – hidden from default views, preserved for later
#   archived – moved to frame/archive/, read-only
#
# Example:
#
# [[tracks]]
# id = "api"
# name = "API Layer"
# state = "active"
# file = "tracks/api.md"

# ID Prefixes
# -----------
# Maps track IDs to the uppercase prefix used for task IDs.
# e.g. track "api" with prefix "API" generates API-001, API-002, etc.
#
# [ids.prefixes]
# api = "API"

# Agent
# -----
# Settings for AI coding agent integration.
#
[agent]
cc_focus = ""                # track ID for `fr ready --cc` (empty = none)
cc_only = true               # true: agent only works on #cc tasks
                             # false: agent can pick up any unblocked task

# Clean
# -----
# Auto-clean and archival settings.
#
# Archiving has two independent triggers, because either one alone is blind to
# a real case: a count cannot tell 100 done one-liners from 100 done essays,
# and bytes cannot see a track quietly accumulating hundreds of trivial tasks.
# Whichever trips, the drain goes down to the *retain* level rather than back to
# the trigger — that gap is deliberate, and without it a track would archive one
# task per clean for ever.

[clean]
auto_clean = true            # run clean after file reload in TUI
                             # (skipped while git is rewriting tracked files)
done_threshold = 100         # max done tasks per track before archiving
done_retain = 10             # number of recent done tasks to keep in track after archiving
done_bytes_threshold = "256KB"  # max bytes of done tasks before archiving; 0 / "off" disables
                             # (at a typical note length this is about the same
                             # statement as done_threshold — the two only diverge
                             # once notes run long, which is the point)
done_bytes_retain = "64KB"   # what a byte-triggered archive drains down to
archive_per_track = true     # separate archive file per track

# Limits
# ------
# What frame's own commands will not do. These are guardrails on authoring, not
# invariants on the file: markdown stays hand-editable and `fr import` is exempt,
# because that is how content that predates a limit gets in.

[limits]
note_max_bytes = "16KB"      # largest note frame's commands will GROW a note to;
                             # 0 / "off" disables. Enforcement is non-increasing:
                             # a note already over the limit is never touched,
                             # never truncated, and can still be edited down —
                             # only writes that lengthen it are refused
note_repeat_bytes = 120      # shortest run of consecutive lines an append may not
                             # repeat verbatim into a note, and the same threshold
                             # `fr check` reports a note for already holding twice.
                             # `fr note` appends, and an agent that believes it
                             # replaces writes the whole note out each time — one
                             # real note reached eight copies of itself.
                             # 0 / "off" disables both
track_warn_bytes = "512KB"   # `fr check` warns past this much OPEN work in one
                             # track (## Backlog + ## Parked). Done is excluded
                             # because [clean] already bounds it, and does so by
                             # swinging between the two done_bytes settings above —
                             # counting that swing would make the warning fire and
                             # clear on the archiver's schedule rather than on
                             # anything its reader did. 0 / "off" disables

# UI
# --
# TUI display settings.

# Recovery log
# ------------
# Size is a trigger for housekeeping, not a cap: outgrowing max_size is what
# makes frame consider trimming, and nothing younger than prune_age_days is
# ever removed. To keep entries longer, raise prune_age_days.
#
# [recovery]
# max_size = "5MB"           # bytes, or a size with a unit (KB/MB/GB)
# prune_age_days = 30        # also the default cutoff for `fr recovery prune`
# path = "frame/.recovery.log"  # relative to the project root; absolute paths
#                               # are machine-specific — prefer FRAME_RECOVERY_LOG

[ui]
kitty_keyboard = true        # enhanced keyboard protocol (set false if your terminal has issues)
note_wrap = true             # soft word wrap in note editor
board_done_days = 7          # days of done tasks to show in board view (0 = hide Done column)
default_tags = ["cc"]        # tags always shown in autocomplete
# ref_extensions = ["md"]    # file extensions for ref/spec autocomplete (empty = all)
ref_paths = ["doc", "spec", "docs", "design", "papers"]  # directories for ref/spec autocomplete (empty = whole project)

# Tag Colors
# ----------
# Assign colors to tags. Values are hex colors.
#
# [ui.tag_colors]
# bug = "#FF4444"
# design = "#44DDFF"
# ready = "#44FF88"
# cc = "#CC66FF"
# lost = "#FF8800"

# Color Overrides
# ---------------
# Override default state/UI colors.
#
# [ui.colors]
